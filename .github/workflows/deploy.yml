name: CI-CD Deploy

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (CI check)
        run: docker build -t chess-app -f Gateway.API/Dockerfile .
        run: docker build -t chess-app -f webAssemblyChessGame.Services.ChessGameAPI/Dockerfile .
        run: docker build -t chess-app -f BlazorServerSideClient/Dockerfile .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PUBLIC_KEY }}
          script: |
            cd /root/ChessGameApplication
            git pull origin main
            docker compose down
            docker compose up --build -d