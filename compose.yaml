services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server
    container_name: sqlserver_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Karokar3.
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"

  gateway.api:
    image: gateway.api
    build:
      context: .
      dockerfile: Gateway.API/Dockerfile
    environment:
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Karokar3.
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    ports:
      - "7124:8081"
    volumes:
      - ./certs:/https:ro

  chessgame.api:
    image: chessgame.api
    build:
      context: .
      dockerfile: webAssemblyChessGame.Services.ChessGameAPI/Dockerfile
    environment:
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Karokar3.
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    ports:
      - "5203:8081"
    volumes:
      - ./certs:/https:ro

  blazor.client:
    image: blazorserversideclient
    build:
      context: .
      dockerfile: BlazorServerSideClient/Dockerfile
    environment:
      - ASPNETCORE_URLS=https://+:8081;http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Karokar3.
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    ports:
      - "5191:8081"
    volumes:
      - ./certs:/https:ro
    depends_on:
      - sqlserver